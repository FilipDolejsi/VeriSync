<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VeriSync{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
          colors: {
            surface: { DEFAULT:'#0d0e14', card:'#12141c', border:'#1e2130', hover:'#1a1d2a' },
            accent: { DEFAULT:'#22d3ee', dim:'#164e63' },
          }
        }
      }
    }
  </script>
  <style>
    body { background:#0d0e14; color:#e2e4ed; font-family:'Inter',sans-serif; }
    .card { background:#12141c; border:1px solid #1e2130; border-radius:12px; }
    .nav-link { color:#6b7280; font-size:14px; padding:6px 12px; border-radius:6px; transition:all .15s; }
    .nav-link:hover { color:#e2e4ed; background:#1a1d2a; }
    .nav-link.active { color:#22d3ee; }
    .badge-critical { background:#450a0a; color:#f87171; }
    .badge-warning  { background:#451a03; color:#fb923c; }
    .badge-info     { background:#0c1a40; color:#60a5fa; }
    .badge { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:500; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#2d3148; border-radius:4px; }
  </style>
</head>
<body>

<!-- Top nav -->
<nav style="background:#0d0e14;border-bottom:1px solid #1e2130;" class="px-6 py-3 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-6">
    <a href="/" class="flex items-center gap-2 mr-4">
      <div style="width:28px;height:28px;background:linear-gradient(135deg,#22d3ee,#6366f1);border-radius:7px;"></div>
      <span style="font-weight:600;font-size:15px;letter-spacing:-.3px;">VeriSync</span>
    </a>
    {% if user %}
    <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/graph" class="nav-link {% if request.url.path == '/graph' %}active{% endif %}">Pipeline</a>
    <a href="/docs" class="nav-link {% if request.url.path == '/docs' %}active{% endif %}">Docs</a>
    {% endif %}
  </div>

  <div class="flex items-center gap-4">
    {% if user %}
    <!-- Balance -->
    <div class="flex items-center gap-1.5 font-mono text-sm" style="color:#fbbf24;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span id="satBalance">{{ user.sat_balance }}</span>
      <span style="color:#6b7280;font-size:12px;">sats</span>
    </div>

    <!-- Repo selector -->
    <select id="repoSelector" style="background:#12141c;border:1px solid #1e2130;color:#9ca3af;font-size:13px;border-radius:7px;padding:5px 10px;cursor:pointer;">
      <option value="">Watch a repo…</option>
    </select>

    <!-- Avatar -->
    <div class="flex items-center gap-2">
      <img src="{{ user.avatar_url }}" class="rounded-full" style="width:28px;height:28px;" alt="">
      <span style="font-size:13px;color:#9ca3af;">{{ user.username }}</span>
      <a href="/auth/logout" style="font-size:12px;color:#4b5563;margin-left:4px;" class="hover:text-gray-400">logout</a>
    </div>
    {% else %}
    <a href="/auth/login"
       style="background:#22d3ee;color:#0d0e14;font-weight:600;font-size:13px;padding:7px 16px;border-radius:7px;"
       class="flex items-center gap-2 hover:opacity-90 transition">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      Sign in with GitHub
    </a>
    {% endif %}
  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>

{% if user %}
<script>
// ── Repo loader ───────────────────────────────────────────────────────────────
fetch("/api/repos").then(r=>r.json()).then(repos=>{
  const sel = document.getElementById("repoSelector");
  if(!sel) return;
  repos.forEach(r=>{
    const o = document.createElement("option");
    o.value = r.full_name;
    o.textContent = r.full_name + (r.private?" 🔒":"");
    sel.appendChild(o);
  });
}).catch(()=>{});

document.getElementById("repoSelector")?.addEventListener("change", e=>{
  const repo = e.target.value; if(!repo) return;
  fetch("/repos/watch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({repos:[repo]})})
  .then(r=>r.json()).then(d=>{
    const msg = d.registered?.length ? `✓ Now watching ${repo}` : `✗ ${d.failed?.[0]?.error||"error"}`;
    showToast(msg, d.registered?.length ? "success" : "error");
  });
  e.target.value="";
});

// ── SSE ───────────────────────────────────────────────────────────────────────
const es = new EventSource("/events");
es.onmessage = e => {
  try {
    const ev = JSON.parse(e.data);
    window.dispatchEvent(new CustomEvent("vs", {detail: ev}));
    if(ev.type==="sat_spent"){
      const el = document.getElementById("satBalance");
      if(el) el.textContent = ev.new_balance;
    }
  } catch(_){}
};

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type="success") {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;
    background:${type==="success"?"#064e3b":"#450a0a"};color:${type==="success"?"#6ee7b7":"#fca5a5"};
    border:1px solid ${type==="success"?"#065f46":"#7f1d1d"};box-shadow:0 4px 12px rgba(0,0,0,.4)`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}
window.showToast = showToast;
</script>
{% endif %}

{% block scripts %}{% endblock %}
</body>
</html>
