{% extends "base.html" %}
{% block title %}Review Report — VeriSync{% endblock %}
{% block content %}
<div class="mb-6">
  <a href="/dashboard" class="text-sm text-gray-500 hover:text-gray-300">← Dashboard</a>
</div>
<div id="reportContent" class="space-y-4">
  <div class="text-gray-600 text-sm">Loading report…</div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const prId = "{{ pr_id }}";

  fetch(`/api/history`).then(r => r.json()).then(prs => {
    const pr = prs.find(p => p.id === prId);
    if (!pr) { document.getElementById("reportContent").innerHTML = "<p class='text-gray-500'>Report not found.</p>"; return; }

    document.getElementById("reportContent").innerHTML = `
      <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
        <h1 class="text-lg font-bold text-white mb-1">${pr.pr_title || pr.pr_url}</h1>
        <div class="text-xs text-gray-500 mb-4">${pr.repo_full_name} · ${pr.started_at?.slice(0,16)}</div>
        <div class="flex gap-6 text-sm">
          <div><span class="text-yellow-400 font-bold">${pr.total_cost_sats}</span> sats</div>
          <div><span class="text-red-400 font-bold">${pr.critical_count}</span> critical</div>
          <div><span class="text-yellow-400 font-bold">${pr.warning_count}</span> warnings</div>
          <div><span class="text-blue-400 font-bold">${pr.info_count}</span> info</div>
        </div>
      </div>`;
  });
</script>
{% endblock %}
